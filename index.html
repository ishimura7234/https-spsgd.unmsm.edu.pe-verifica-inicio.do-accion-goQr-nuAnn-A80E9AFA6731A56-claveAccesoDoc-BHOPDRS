<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Documento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
        }
        /* Botón flotante para asegurar la descarga en dispositivos móviles */
        .download-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: scale(1.05);
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- El visor carga el archivo "documento.pdf" que debe estar en la misma carpeta -->
        <iframe src="documento.pdf#toolbar=1&navpanes=0&scrollbar=1"></iframe>
    </div>

    <!-- Botón de respaldo para abrir/descargar directamente si el navegador bloquea el iframe -->
    <a href="documento.pdf" download="documento.pdf" class="download-btn">
        📥 Descargar Documento
    </a>

</body>
</html>
